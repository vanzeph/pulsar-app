# Example experiment stored in the unified store (task STORE1).
#
# Pushed with:
#   pulsar store put examples/store/experiment.toml \
#       --namespace experiments --name momentum_store_demo
#
# It references the custom factor stored alongside it
# (examples/store/custom_factor.py), which assembly materializes and
# registers before this document resolves its factor names.

[experiment]
id = "momentum_store_demo"
status = "candidate"                 # candidate | active | retired (C6)

[universe]
symbols = ["SH600519", "SH600036", "SH601318", "SZ000001", "SZ000858"]

[factors]
names = ["momentum_20", "close_over_ma10"]   # custom factor from the store
preprocess = ["winsorize", "zscore"]

[model]
type = "equal_weight"

[portfolio]
method = "top_n"
top_n = 3
rebalance = "monthly"

[backtest]
start = 2024-01-01
end = 2024-12-31
costs = "a_share_default"
seed = 7
