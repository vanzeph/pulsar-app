name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: typecheck + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Typecheck (mypy strict)
        run: python -m mypy

      - name: Import surface check
        run: |
          python - <<'PY'
          import pulsar_app

          surface = [
              "RunConfig", "load_config", "PluginRegistry", "PluginSpec",
              "assemble_run", "execute_run", "RunManifest", "LiveModeLockedError",
          ]
          missing = [name for name in surface if not hasattr(pulsar_app, name)]
          assert not missing, f"missing public API: {missing}"
          assert len(pulsar_app.DEFAULT_REGISTRY) == 0, "pulsar-app must ship no plugins"
          print(f"import surface OK (pulsar-app {pulsar_app.__version__})")
          PY

      - name: Tests (pytest)
        run: python -m pytest

  install:
    name: pip installability smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from source (non-editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: CLI smoke check
        run: |
          pulsar --version
          if pulsar research --config /nonexistent.toml; then
            echo "expected exit code 2 for a missing config" >&2; exit 1
          fi

  topology-gate:
    name: cross-repo topology gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch topology gate tool (versioned reference)
        run: |
          git clone --quiet https://github.com/vanzeph/pulsar-contracts.git /tmp/pulsar-contracts
          git -C /tmp/pulsar-contracts checkout --quiet 4178b2ee27757b858922d26b7e1a532acf953e7e

      - name: Topology check (pulsar-app)
        run: python /tmp/pulsar-contracts/tools/check_topology.py --repo "$GITHUB_WORKSPACE"
