[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsar-app"
version = "0.1.0"
description = "Pulsar runtime assembly: TOML-driven configuration, plugin registry, run assembly and the research/paper/live CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "vanzeph" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "pulsar-contracts @ git+https://github.com/vanzeph/pulsar-contracts.git@2e3e393",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.8",
    "pandas-stubs>=2",
]
# The delivered domain stack the e2e chain assembles (task A9): pinned to
# the six-repo main heads under test; pulsar-contracts is pinned in
# [project.dependencies] to the same short ref every downstream repo
# declares (unified at 2e3e393 across core/exec/app/data).
e2e = [
    "pulsar-core @ git+https://github.com/vanzeph/pulsar-core.git@8e5620e0b86fd11a8ee872e60463bb8204fb7339",
    "pulsar-data @ git+https://github.com/vanzeph/pulsar-data.git@99e093d247030eacbb185fc53cf7880fe266cfc0",
    "pulsar-exec @ git+https://github.com/vanzeph/pulsar-exec.git@ab94f1ff81cabf9342d55e562e8f2c56f1408e6d",
]
# Network-only extras for tools/make_e2e_fixtures.py (recording, never CI).
e2e-recorder = [
    "akshare>=1.14",
    "baostock>=0.8",
]

[project.urls]
Repository = "https://github.com/vanzeph/pulsar-app"

[project.scripts]
pulsar = "pulsar_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsar_app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "pulsar_contracts.*"
ignore_missing_imports = true
